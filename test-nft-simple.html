<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Simple NFT Test</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <div class="arjs-loader">
        <div>Loading, please wait...</div>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: false;">

        <a-nft
            type="nft"
            url="./markers/zyn-apple-mint"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5">

            <a-entity
                text="value: ZYN DETECTED!; color: red; scale: 5 5 5; position: 0 2 0"
            ></a-entity>

            <a-box
                position="0 0.5 0"
                material="color: green;"
                scale="1 1 1"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
            </a-box>

        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        console.log('🚀 Simple NFT test started');

        // Track NFT loading
        document.querySelector('a-nft').addEventListener('markerFound', function() {
            console.log('🎯🎯🎯 MARKER FOUND - SUCCESS! 🎯🎯🎯');
        });

        document.querySelector('a-nft').addEventListener('markerLost', function() {
            console.log('📍 Marker lost');
        });

        setTimeout(() => {
            document.querySelector('.arjs-loader').style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
