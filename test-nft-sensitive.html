<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Sensitive NFT Test</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
        }
        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <div class="arjs-loader">
        <div>Loading Sensitive NFT Test...</div>
    </div>

    <div id="debug-info">
        Status: Initializing...<br>
        Detection: Waiting...<br>
        Frames: 0
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <!-- More sensitive NFT settings -->
        <a-nft
            type="nft"
            url="./markers/zyn-apple-mint"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.05"
            smoothThreshold="2">

            <a-entity
                text="value: DETECTED!; color: red; scale: 10 10 10; position: 0 3 0"
            ></a-entity>

            <a-box
                position="0 1 0"
                material="color: lime;"
                scale="2 2 2"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 1000">
            </a-box>

            <a-plane
                position="0 0 -0.5"
                rotation="-90 0 0"
                width="5"
                height="5"
                color="yellow"
                opacity="0.7"
                material="transparent: true">
            </a-plane>

        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        console.log('🔧 Sensitive NFT test started');

        let frameCount = 0;
        let detectionAttempts = 0;

        const debugDiv = document.getElementById('debug-info');

        function updateDebug(status, detection) {
            debugDiv.innerHTML = `
                Status: ${status}<br>
                Detection: ${detection}<br>
                Frames: ${frameCount}<br>
                Attempts: ${detectionAttempts}
            `;
        }

        // Track NFT events
        const nft = document.querySelector('a-nft');

        nft.addEventListener('markerFound', function() {
            console.log('🎯🎯🎯 SENSITIVE MARKER FOUND! 🎯🎯🎯');
            updateDebug('Active', 'FOUND!');
        });

        nft.addEventListener('markerLost', function() {
            console.log('📍 Marker lost');
            updateDebug('Active', 'Lost');
        });

        // Update frame counter
        setInterval(() => {
            frameCount++;
            detectionAttempts++;
            updateDebug('Running', `Scanning... ${detectionAttempts}`);
        }, 100);

        setTimeout(() => {
            document.querySelector('.arjs-loader').style.display = 'none';
            updateDebug('Ready', 'Point at ZYN image');
        }, 3000);
    </script>
</body>
</html>
