<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailAR - AR.js Product Recognition</title>

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js 3.4.5 for NFT (Image Tracking) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #fff;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Product Information Panel */
        .product-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .product-info.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .product-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-details {
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .product-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-learn {
            background: #007AFF;
            color: white;
        }

        .btn-buy {
            background: #00ff88;
            color: black;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Debug Info */
        #debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 200;
            display: none;
        }

        /* Mobile Console for debugging */
        #mobile-console {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-family: monospace;
            font-size: 10px;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        /* AR Scene Styling */
        a-scene {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            .product-info {
                bottom: 10px;
                left: 10px;
                right: 10px;
                padding: 15px;
            }

            .product-name {
                font-size: 20px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Initializing AR Tracking...</div>
    </div>

    <!-- AR Scene -->
    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        embedded
        gesture-detector
    >

        <!-- Assets -->
        <a-assets>
            <!-- 3D Models -->
            <a-asset-item id="zyn-green-model" src="./models/3d/products/green.glb"></a-asset-item>
            <a-asset-item id="zyn-blue-model" src="./models/3d/products/blue.glb"></a-asset-item>
            <a-asset-item id="terea-yellow-model" src="./models/terea-yellow.glb"></a-asset-item>
            <a-asset-item id="terea-sienna-model" src="./models/terea-sienna.glb"></a-asset-item>
            <a-asset-item id="iqos-iluma-model" src="./models/iqos-iluma-prime.glb"></a-asset-item>
        </a-assets>

        <!-- ZYN Apple Mint NFT Marker -->
        <a-nft
            type="nft"
            url="./markers/zyn-apple-mint"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
            id="zyn-apple-mint-marker"
        >
            <!-- Background Plane -->
            <a-plane
                position="0 0 -0.1"
                rotation="-90 0 0"
                width="4"
                height="4"
                color="#00ff88"
                opacity="0.85"
                material="transparent: true"
            ></a-plane>

            <!-- 3D Model -->
            <a-entity
                gltf-model="#zyn-green-model"
                scale="0.65 0.65 0.65"
                position="0 0 0"
                rotation="-90 0 0"
                class="clickable"
                animation-mixer
                gesture-handler
            ></a-entity>

            <!-- Info Text -->
            <a-text
                value="ZYN Apple Mint\n6mg Nicotine"
                position="0 1 0"
                align="center"
                color="white"
                scale="0.8 0.8 0.8"
            ></a-text>
        </a-nft>

        <!-- ZYN Spearmint NFT Marker -->
        <a-nft
            type="nft"
            url="./markers/zyn-spearmint"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
            id="zyn-spearmint-marker"
        >
            <!-- Background Plane -->
            <a-plane
                position="0 0 -0.1"
                rotation="-90 0 0"
                width="4"
                height="4"
                color="#4dd0e1"
                opacity="0.85"
                material="transparent: true"
            ></a-plane>

            <!-- 3D Model -->
            <a-entity
                gltf-model="#zyn-blue-model"
                scale="0.65 0.65 0.65"
                position="0 0 0"
                rotation="-90 0 0"
                class="clickable"
                animation-mixer
                gesture-handler
            ></a-entity>

            <!-- Info Text -->
            <a-text
                value="ZYN Spearmint\n6mg Nicotine"
                position="0 1 0"
                align="center"
                color="white"
                scale="0.8 0.8 0.8"
            ></a-text>
        </a-nft>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- Product Information Panel -->
    <div id="product-info" class="product-info">
        <div class="product-name" id="product-name"></div>
        <div class="product-details" id="product-details"></div>
        <div class="product-buttons">
            <a href="#" class="btn btn-learn" id="learn-more-btn" target="_blank">Learn More</a>
            <a href="#" class="btn btn-buy" id="buy-btn" target="_blank">Buy Now</a>
        </div>
    </div>

    <!-- Debug Information -->
    <div id="debug-info">
        <div>AR Status: <span id="ar-status">Initializing</span></div>
        <div>Tracking: <span id="tracking-status">No target</span></div>
        <div>Camera: <span id="camera-status">Loading</span></div>
    </div>

    <!-- Mobile Console for debugging -->
    <div id="mobile-console"></div>

    <script>
        // Mobile console for debugging
        (function() {
            const mobileConsole = document.getElementById('mobile-console');
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;

            // Show mobile console on mobile devices or when URL contains debug
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const debugMode = window.location.search.includes('debug') || window.location.hash.includes('debug');

            if (isMobile || debugMode) {
                mobileConsole.style.display = 'block';
                document.getElementById('debug-info').style.display = 'block';
            }

            function addToMobileConsole(type, args) {
                if (mobileConsole.style.display === 'none') return;

                const timestamp = new Date().toLocaleTimeString();
                const message = Array.from(args).map(arg =>
                    typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
                ).join(' ');

                const div = document.createElement('div');
                div.style.color = type === 'error' ? '#ff6b6b' : type === 'warn' ? '#ffd93d' : '#00ff00';
                div.textContent = `[${timestamp}] ${message}`;

                mobileConsole.appendChild(div);
                mobileConsole.scrollTop = mobileConsole.scrollHeight;

                // Keep only last 50 messages
                while (mobileConsole.children.length > 50) {
                    mobileConsole.removeChild(mobileConsole.firstChild);
                }
            }

            console.log = function(...args) {
                addToMobileConsole('log', args);
                originalLog.apply(console, args);
            };

            console.error = function(...args) {
                addToMobileConsole('error', args);
                originalError.apply(console, args);
            };

            console.warn = function(...args) {
                addToMobileConsole('warn', args);
                originalWarn.apply(console, args);
            };
        })();

        // Product configurations
        const productConfigs = {
            'zyn-apple-mint': {
                name: 'ZYN Apple Mint',
                details: '6mg Nicotine • Fresh Apple & Cool Mint',
                pricing: '$4.99',
                learnMoreUrl: 'https://zyn.com/products/apple-mint',
                buyUrl: 'https://store.zyn.com/apple-mint'
            },
            'zyn-spearmint': {
                name: 'ZYN Spearmint',
                details: '6mg Nicotine • Cool Spearmint & Fresh',
                pricing: '$4.99',
                learnMoreUrl: 'https://zyn.com/products/spearmint',
                buyUrl: 'https://store.zyn.com/spearmint'
            },
            'terea-yellow': {
                name: 'TEREA Yellow Selection',
                details: '6mg Nicotine • Balanced Tobacco & Smooth',
                pricing: '$6.50',
                learnMoreUrl: 'https://iqos.com/products/terea-yellow',
                buyUrl: 'https://store.iqos.com/terea-yellow'
            },
            'terea-sienna': {
                name: 'TEREA Sienna',
                details: '6mg Nicotine • Rich Tobacco & Woody',
                pricing: '$6.50',
                learnMoreUrl: 'https://iqos.com/products/terea-sienna',
                buyUrl: 'https://store.iqos.com/terea-sienna'
            }
        };

        // AR.js event handlers
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 AR.js RetailAR initialized');

            // Hide loading screen after a delay
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                console.log('✅ Loading screen hidden');
            }, 3000);

            // Update debug info
            document.getElementById('ar-status').textContent = 'Ready';
            document.getElementById('camera-status').textContent = 'Active';

            // Setup NFT marker event listeners - Only ZYN markers (TEREA disabled)
            const markers = ['zyn-apple-mint', 'zyn-spearmint'];

            markers.forEach(markerId => {
                const marker = document.getElementById(markerId + '-marker');
                console.log(`🔍 Looking for marker: ${markerId}`, marker ? '✅ Found' : '❌ Not found');

                if (marker) {
                    // Marker found
                    marker.addEventListener('markerFound', function() {
                        console.log(`🎯 ${markerId} marker FOUND!`);
                        document.getElementById('tracking-status').textContent = `Tracking: ${markerId}`;
                        showProductInfo(markerId);
                    });

                    // Marker lost
                    marker.addEventListener('markerLost', function() {
                        console.log(`📍 ${markerId} marker lost`);
                        document.getElementById('tracking-status').textContent = 'No target';
                        hideProductInfo();
                    });

                    // NFT loading events for debugging
                    marker.addEventListener('nftLoaded', function() {
                        console.log(`✅ ${markerId} NFT descriptors loaded successfully`);
                    });

                    marker.addEventListener('nftLoadingFailed', function(e) {
                        console.error(`❌ ${markerId} NFT loading failed:`, e.detail);
                    });
                }
            });
        });

        // Show product information panel
        function showProductInfo(productId) {
            const config = productConfigs[productId];
            if (!config) return;

            document.getElementById('product-name').textContent = config.name;
            document.getElementById('product-details').textContent = config.details + ' • ' + config.pricing;
            document.getElementById('learn-more-btn').href = config.learnMoreUrl;
            document.getElementById('buy-btn').href = config.buyUrl;

            document.getElementById('product-info').classList.add('visible');
        }

        // Hide product information panel
        function hideProductInfo() {
            document.getElementById('product-info').classList.remove('visible');
        }

        // A-Frame component for gesture handling
        AFRAME.registerComponent('gesture-handler', {
            schema: {
                enabled: { default: true },
                rotationFactor: { default: 5 },
                minScale: { default: 0.3 },
                maxScale: { default: 8 },
            },

            init: function () {
                this.handleScale = this.handleScale.bind(this);
                this.handleRotation = this.handleRotation.bind(this);

                this.isVisible = false;
                this.initialScale = this.el.object3D.scale.clone();
            },

            play: function () {
                this.el.sceneEl.addEventListener('onefingermove', this.handleRotation);
                this.el.sceneEl.addEventListener('twofingermove', this.handleScale);
            },

            pause: function () {
                this.el.sceneEl.removeEventListener('onefingermove', this.handleRotation);
                this.el.sceneEl.removeEventListener('twofingermove', this.handleScale);
            },

            handleRotation: function (event) {
                if (this.isVisible) {
                    this.el.object3D.rotation.y += event.detail.positionChange.x * this.data.rotationFactor;
                    this.el.object3D.rotation.x += event.detail.positionChange.y * this.data.rotationFactor;
                }
            },

            handleScale: function (event) {
                if (this.isVisible) {
                    this.scaleFactor *= 1 + event.detail.spreadChange / event.detail.startSpread;

                    this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);

                    this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
                    this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
                    this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
                }
            },
        });

        // A-Frame gesture detector
        AFRAME.registerComponent('gesture-detector', {
            schema: {
                element: { default: '' }
            },

            init: function () {
                this.targetElement = this.data.element && document.querySelector(this.data.element) || this.el;

                this.internalState = {
                    previousState: null
                };

                this.emitGestureEvent = this.emitGestureEvent.bind(this);

                this.targetElement.addEventListener('touchstart', this.handleTouchStart.bind(this));
                this.targetElement.addEventListener('touchend', this.handleTouchEnd.bind(this));
                this.targetElement.addEventListener('touchmove', this.handleTouchMove.bind(this));
            },

            handleTouchStart: function (event) {
                this.prevState = this.getTouchState(event);
            },

            handleTouchEnd: function (event) {
                this.prevState = null;
            },

            handleTouchMove: function (event) {
                if (this.prevState) {
                    event.preventDefault();

                    const state = this.getTouchState(event);

                    const emitDetail = {
                        positionChange: {
                            x: state.spread - this.prevState.spread,
                            y: state.positionChange.y
                        }
                    };

                    if (this.prevState.spread > 0 && state.spread > 0) {
                        emitDetail.spreadChange = state.spread / this.prevState.spread;
                    }

                    // Check if two finger gesture
                    if (state.touchCount == 2) {
                        emitDetail.startSpread = this.prevState.spread;
                        this.el.emit('twofingermove', emitDetail);
                    } else {
                        this.el.emit('onefingermove', emitDetail);
                    }

                    this.prevState = state;
                }
            },

            getTouchState: function (event) {
                if (event.touches.length === 0) {
                    return null;
                }

                if (event.touches.length === 1) {
                    return {
                        touchCount: 1,
                        positionChange: {
                            x: event.touches[0].clientX,
                            y: event.touches[0].clientY
                        }
                    };
                }

                // two finger gesture
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;

                return {
                    touchCount: 2,
                    spread: Math.sqrt(dx * dx + dy * dy),
                    positionChange: {
                        x: (event.touches[0].clientX + event.touches[1].clientX) / 2,
                        y: (event.touches[0].clientY + event.touches[1].clientY) / 2
                    }
                };
            },

            emitGestureEvent: function (name, detail) {
                this.el.emit(name, detail);
            }
        });
    </script>
</body>
